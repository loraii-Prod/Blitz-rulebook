name: Restore 30/70 seeding scorecard

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore-seeding-card:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore seeding scorecard
        run: python -c 'from pathlib import Path; p=Path("index.html"); t=p.read_text(); css="<style id=\"blitz-seeding-card-restore\">.seed-layout{display:grid!important;grid-template-columns:.72fr 1.28fr!important;gap:36px!important;align-items:stretch}.scorecard{border-top:1px solid var(--hair)!important;padding-top:18px!important}.score-total{display:flex!important;justify-content:space-between!important;align-items:flex-end!important}.score-total strong{font-size:58px!important;line-height:.85!important;letter-spacing:-.08em!important}.score-total span{color:var(--muted)!important}.splitbar{height:16px!important;display:grid!important;grid-template-columns:30fr 70fr!important;margin:24px 0 34px!important}.splitbar i:first-child{background:var(--acid)!important}.splitbar i:last-child{background:#34392f!important}.round-grid{display:grid!important;grid-template-columns:repeat(10,1fr)!important;border-top:1px solid var(--hair)!important;border-left:1px solid var(--hair)!important}.round{padding:16px 10px 18px!important;border-right:1px solid var(--hair)!important;border-bottom:1px solid var(--hair)!important;min-height:92px!important}.round b{font-size:17px!important}.round small{display:block!important;margin-top:22px!important;color:var(--muted)!important}@media(max-width:980px){.seed-layout{grid-template-columns:1fr!important}}@media(max-width:680px){.round-grid{grid-template-columns:repeat(5,1fr)!important}}</style>"; js="<script id=\"blitz-seeding-card-script\">(()=>{const s=document.querySelector(\".scorecard\");if(!s)return;const a=s.querySelector(\".score-total\");if(a){const b=a.querySelector(\"strong\"),c=a.querySelector(\"span\");if(b)b.textContent=\"30 / 70\";if(c)c.textContent=\"TA / ROUNDS\"}const g=s.querySelector(\".round-grid\");if(g){const w=[14,12,11,9,8,6,5,3,2,0];g.innerHTML=w.map((x,i)=>{const q=i===0?\"fastest\":(i===w.length-1?\"slowest\":\"\");return \"<div class=\\\"round\\\"><b>\"+x+\"%</b><small>\"+String(i+1).padStart(2,\"0\")+(q?\" /<br>\"+q:\"\")+\"</small></div>\"}).join(\"\")}const n=[...s.querySelectorAll(\"p\")].find(x=>/rounds are ranked/i.test(x.textContent));if(n)n.textContent=\"Rounds are ranked fastest → slowest. Your slowest round is worth 0%.\"})();</script>"; ("blitz-seeding-card-restore" in t) and (_ for _ in ()).throw(SystemExit("already installed")); t=t.replace("</head>",css+"</head>",1).replace("</body>",js+"</body>",1); p.write_text(t)'
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Restore 30/70 seeding scorecard layout"
          git push
