name: Publish approved rulebook changes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply approved changes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          t = p.read_text()
          t = t.replace('<div class="t">Seeding Session 2</div><div class="s">+1 COTD</div>', '<div class="t">Seeding Session 2</div><div class="s">+0 COTD</div>')
          t = t.replace('<div class="name">Seeding Session 2</div><div class="time mono">+1 COTD</div>', '<div class="name">Seeding Session 2</div><div class="time mono">+0 COTD</div>')
          p.write_text(t)
          PY
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No index changes needed."
            exit 0
          fi
          git commit -m "Restore Seeding Session 2 to COTD +0"
          git push
