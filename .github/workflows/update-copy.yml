name: Restore original seeding weights

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-seeding:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore original seeding weights
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          t = p.read_text()
          t = t.replace('grid-template-columns:repeat(10,1fr)', 'grid-template-columns:repeat(8,1fr)')
          t = t.replace('<div class="round"><b>14%</b><small>01 /<br>fastest</small></div><div class="round"><b>12%</b><small>02</small></div><div class="round"><b>11%</b><small>03</small></div><div class="round"><b>9%</b><small>04</small></div><div class="round"><b>8%</b><small>05</small></div><div class="round"><b>6%</b><small>06</small></div><div class="round"><b>5%</b><small>07</small></div><div class="round"><b>3%</b><small>08</small></div><div class="round"><b>2%</b><small>09</small></div><div class="round"><b>0%</b><small>10 /<br>slowest</small></div>', '<div class="round"><b>17.5%</b><small>01 /<br>fastest</small></div><div class="round"><b>15%</b><small>02</small></div><div class="round"><b>12.5%</b><small>03</small></div><div class="round"><b>10%</b><small>04</small></div><div class="round"><b>7.5%</b><small>05</small></div><div class="round"><b>5%</b><small>06</small></div><div class="round"><b>2.5%</b><small>07</small></div><div class="round"><b>0%</b><small>08 /<br>slowest</small></div>')
          t = t.replace('[14,12,11,9,8,6,5,3,2,0]', '[17.5,15,12.5,10,7.5,5,2.5,0]')
          p.write_text(t)
          PY
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Restore original 8-round seeding weights"
          git push
