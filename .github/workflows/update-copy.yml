name: Update seeding round weights

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-seeding:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update round weights
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text()
          replacements = {
            '17.5%': '18%',
            '12.5%': '13%',
            '7.5%': '7%',
            '2.5%': '2%'
          }
          changed = False
          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new)
                  changed = True
          if not changed:
              raise SystemExit('No decimal seeding weights found; no change made.')
          p.write_text(text)
          PY
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Use whole percentages for seeding rounds"
          git push
