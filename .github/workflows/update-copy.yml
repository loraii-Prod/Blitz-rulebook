name: Publish approved rulebook changes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply approved changes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          t = p.read_text()
          css = '''/* SEEDING VISUAL GUIDE */
          .seed-guide{display:grid;grid-template-columns:repeat(5,1fr);border:1px solid var(--hair);background:#0b0d0a}
          .seed-step{position:relative;min-height:280px;padding:24px 20px;border-right:1px solid var(--hair);text-align:center;display:flex;flex-direction:column;align-items:center}
          .seed-step:last-child{border-right:0}.seed-num{width:38px;height:38px;border:1px solid var(--acid);border-radius:50%;display:grid;place-items:center;color:var(--acid);font:700 13px "Courier New",monospace;margin-bottom:20px}.seed-step h3{font-size:16px!important;text-transform:uppercase;margin:0 0 10px}.seed-step p{font-size:14px!important;color:var(--muted);margin:0;line-height:1.45!important}.seed-icon{height:92px;margin-top:auto;padding-top:20px;display:flex;align-items:flex-end;justify-content:center;gap:9px}.seed-map{width:62px;height:54px;border:1px solid var(--hair);display:grid;place-items:center;font-weight:900;font-size:22px}.seed-map.b{border-color:var(--acid);color:var(--acid)}.seed-person{width:28px;height:36px;position:relative;border-radius:12px 12px 5px 5px;background:#c5c9bf}.seed-person:before{content:"";position:absolute;width:15px;height:15px;border-radius:50%;background:#c5c9bf;top:-12px;left:7px}.seed-person.acid,.seed-person.acid:before{background:var(--acid)}.seed-x{font-size:48px;line-height:1;color:#ff5d52;font-weight:900}.seed-drop{display:flex;gap:5px;align-items:center}.seed-result{border:1px solid var(--hair);padding:8px 10px;font:700 12px "Courier New",monospace}.seed-result.drop{border-color:#ff5d52;color:#ff5d52;text-decoration:line-through}.seed-trophy{font-size:64px;color:var(--acid);line-height:1}.seed-short{margin-top:20px;border:1px solid rgba(192,255,52,.45);padding:18px 22px;display:grid;grid-template-columns:120px 1fr;gap:22px;align-items:center;background:rgba(192,255,52,.025)}.seed-short b{color:var(--acid);text-transform:uppercase;font:700 12px "Courier New",monospace;letter-spacing:.1em}.seed-short p{margin:0!important;font-size:14px!important;color:#bdc2b7}.seed-note{margin:0 0 28px;color:var(--muted);font-size:14px!important}.seed-note strong{color:var(--fg)}.seed-scoring{margin-top:28px;border-top:1px solid var(--hair);padding-top:22px}.seed-scoring-head{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:14px}.seed-scoring-head h3{margin:0;text-transform:uppercase}.seed-scoring-head span{color:var(--muted);font-size:13px}.seed-percent-grid{display:grid;grid-template-columns:repeat(8,1fr);border-left:1px solid var(--hair);border-top:1px solid var(--hair)}.seed-percent{padding:16px 8px;border-right:1px solid var(--hair);border-bottom:1px solid var(--hair);text-align:center}.seed-percent b{display:block;color:var(--acid);font-size:20px}.seed-percent small{display:block;color:var(--muted);margin-top:6px;font:700 10px "Courier New",monospace;text-transform:uppercase}
          @media(max-width:1100px){.seed-guide{grid-template-columns:repeat(2,1fr)}.seed-step{border-bottom:1px solid var(--hair)}.seed-step:nth-child(2n){border-right:0}.seed-step:last-child{grid-column:1/-1}.seed-percent-grid{grid-template-columns:repeat(4,1fr)}}
          @media(max-width:680px){.seed-guide{grid-template-columns:1fr}.seed-step{border-right:0}.seed-step:last-child{grid-column:auto}.seed-short{grid-template-columns:1fr;gap:8px}.seed-percent-grid{grid-template-columns:repeat(2,1fr)}.seed-scoring-head{display:block}}
          /* END SEEDING VISUAL GUIDE */'''
          t = re.sub(r'/\* SEEDING VISUAL GUIDE \*/.*?/\* END SEEDING VISUAL GUIDE \*/', '', t, flags=re.S)
          t = t.replace('</style>', css + '\n</style>')
          seeding = '''<section class="section" id="seeding"><div class="section-head"><div class="section-no mono">05</div><h2>Seeding <em>Stage.</em></h2></div><p class="seed-note">Simple version: <strong>2 maps · 2 players on each map · 4 different players total · 10 rounds per map.</strong></p><div class="seed-guide"><div class="seed-step"><div class="seed-num">01</div><h3>Play two maps</h3><p>Seeding is played on Map A and Map B.</p><div class="seed-icon"><div class="seed-map">A</div><div class="seed-map b">B</div></div></div><div class="seed-step"><div class="seed-num">02</div><h3>2 players per map</h3><p>Choose two players for Map A and two different players for Map B.</p><div class="seed-icon"><div class="seed-person"></div><div class="seed-person"></div><div style="width:8px"></div><div class="seed-person acid"></div><div class="seed-person acid"></div></div></div><div class="seed-step"><div class="seed-num">03</div><h3>No double playing</h3><p>If you play Map A, you cannot play Map B. You need 4 different players.</p><div class="seed-icon"><span class="seed-map">A</span><span class="seed-x">×</span><span class="seed-map b">B</span></div></div><div class="seed-step"><div class="seed-num">04</div><h3>Worst result removed</h3><p>After seeding, your worst overall result does not count.</p><div class="seed-icon seed-drop"><span class="seed-result">1st</span><span class="seed-result drop">5th</span><span class="seed-result">2nd</span></div></div><div class="seed-step"><div class="seed-num">05</div><h3>Get your seed</h3><p>The remaining results decide your final seed.</p><div class="seed-icon"><span class="seed-trophy">★</span></div></div></div><div class="seed-short"><b>In short</b><p><strong>Map A:</strong> Players 1 + 2 &nbsp;→&nbsp; <strong>Map B:</strong> Players 3 + 4. Each map is played over <strong>10 rounds</strong>. Your worst overall result is removed, and the remaining results determine your seed. Two sessions are available for each map.</p></div><div class="seed-scoring"><div class="seed-scoring-head"><h3>Seeding score percentages</h3><span>Round ranking → percentage awarded</span></div><div class="seed-percent-grid"><div class="seed-percent"><b>17.5%</b><small>1st</small></div><div class="seed-percent"><b>15%</b><small>2nd</small></div><div class="seed-percent"><b>12.5%</b><small>3rd</small></div><div class="seed-percent"><b>10%</b><small>4th</small></div><div class="seed-percent"><b>7.5%</b><small>5th</small></div><div class="seed-percent"><b>5%</b><small>6th</small></div><div class="seed-percent"><b>2.5%</b><small>7th</small></div><div class="seed-percent"><b>0%</b><small>8th</small></div></div></div></section>'''
          t = re.sub(r'<section class="section" id="seeding">.*?</section>(?=\n<section class="section" id="format">)', seeding, t, count=1, flags=re.S)
          p.write_text(t)
          PY
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No index changes needed."
            exit 0
          fi
          git commit -m "Restore seeding percentages"
          git push
