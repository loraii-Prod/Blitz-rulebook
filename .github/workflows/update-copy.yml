name: Add Falcogrine to organizers

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-admins:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add organizer
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text()
          old = 'loraii / alxshaer / wouter'
          new = 'loraii / alxshaer / wouter / falcogrine'
          if new in text:
              raise SystemExit('Falcogrine already listed.')
          if old not in text:
              raise SystemExit('Organizer list not found; no change made.')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add Falcogrine to organizers"
          git push
