name: Restore original seeding weights

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-seeding:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure original seeding weights
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          t = p.read_text()
          t = t.replace('grid-template-columns:repeat(10,1fr)', 'grid-template-columns:repeat(8,1fr)')
          t = t.replace('[14,12,11,9,8,6,5,3,2,0]', '[17.5,15,12.5,10,7.5,5,2.5,0]')
          p.write_text(t)
          PY
      - name: Commit update if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No index changes needed."
            exit 0
          fi
          git commit -m "Restore original 8-round seeding weights"
          git push
